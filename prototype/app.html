<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F44">
<title>SolutionTee CBT prototype</title>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/phosphor/regular/style.css">
<link rel="stylesheet" href="vendor/phosphor/fill/style.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/tokens.js"></script>
</head>
<body class="proto">
  <aside class="proto-panel" aria-label="Prototype controls">
    <a class="proto-brand" href="index.html"><img src="/brand/favicon.svg" alt=""><span><h1>SolutionTee CBT</h1><span class="t-cap muted">Phase 1 prototype</span></span></a>
    <button class="btn btn-accent btn-sm" id="pFeedback"><i class="ph-fill ph-chat-circle-text"></i> Give feedback on this screen</button>
    <div class="stack g3">
      <div class="ctl"><span>Theme</span><div class="seg" id="pTheme" style="flex:1;max-width:170px"><button data-t="system">Auto</button><button data-t="light">Light</button><button data-t="dark">Dark</button></div></div>
      <label class="ctl"><span>Reduce motion</span><span class="switch"><input type="checkbox" id="pRm"><span></span></span></label>
      <div class="ctl"><span>Network</span><div class="seg" id="pNet" style="flex:1;max-width:170px"><button data-n="on">Online</button><button data-n="off">Offline</button></div></div>
      <div class="ctl"><span>Student plan</span><div class="seg" id="pPlan" style="flex:1;max-width:170px"><button data-p="free">Free</button><button data-p="premium">Premium</button></div></div>
      <div><div class="grp" style="margin-top:0">CBT demo</div>
        <div class="demo"><button class="btn btn-outline btn-sm" data-demo="600">Timer 10:00</button><button class="btn btn-outline btn-sm" data-demo="300">Timer 5:00</button><button class="btn btn-outline btn-sm" data-demo="4">Time up</button><button class="btn btn-outline btn-sm" data-demo="submit">Submit</button></div></div>
      <div><div class="grp" style="margin-top:0">Challenge demo</div>
        <div class="demo"><button class="btn btn-outline btn-sm" id="pCheat">Simulate cheating</button><button class="btn btn-outline btn-sm" id="pClose">Close challenge now</button></div></div>
      <div><div class="grp" style="margin-top:0">Trust demo</div>
        <div class="demo"><button class="btn btn-outline btn-sm" data-trust="unsafe-app">App cloner found</button><button class="btn btn-outline btn-sm" data-trust="device-taken">2nd account on phone</button><button class="btn btn-outline btn-sm" data-trust="banned">Banned</button></div></div>
    </div>
    <hr class="divider">
    <nav id="pList" aria-label="All screens"></nav>
    <a class="btn btn-tonal btn-sm" href="admin.html">Open admin CMS screens</a>
  </aside>

  <div class="stage">
    <div class="phone"><div class="island"></div><div id="host"></div><div id="overlay"></div></div>
  </div>
  <button class="proto-fab" id="fab" aria-label="Prototype menu"><i class="ph ph-list"></i></button>

<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/auto-render.min.js"></script>
<script src="vendor/lottie/lottie_light.min.js"></script>
<script src="js/core.js"></script>
<script src="js/interactions.js"></script>
<script src="js/feedback.js"></script>
<script src="js/screens-onboard.js"></script>
<script src="js/screens-main.js"></script>
<script src="js/screens-cbt.js"></script>
<script src="js/screens-more.js"></script>
<script src="js/screens-extra.js"></script>
<script src="js/screens-compete.js"></script>
<script src="js/screens-trust.js"></script>
<script>
  ST.tokensReady.then(() => {
    // panel: screen list grouped
    const groups = {};
    ST.order.forEach(id => { const g = ST.screens[id].group || 'Other'; (groups[g] = groups[g] || []).push(id); });
    document.getElementById('pList').innerHTML = Object.entries(groups).map(([g, ids]) =>
      `<div class="grp">${g}</div>` + ids.map(id => `<button class="jump" data-go="${id}">${ST.screens[id].title}</button>`).join('')).join('');
    ST.syncPanel = () => {
      document.querySelectorAll('#pTheme button').forEach(b => b.classList.toggle('on', b.dataset.t === ST.getTheme()));
      document.getElementById('pRm').checked = ST.reduceMotion();
      document.querySelectorAll('#pPlan button').forEach(b => b.classList.toggle('on', b.dataset.p === ST.state.plan));
      document.querySelectorAll('#pNet button').forEach(b => b.classList.toggle('on', (b.dataset.n === 'off') === ST.isOffline()));
    };
    const setPlan = pl => { ST.setPlan(pl); ST.syncPanel(); ST.closeOverlay(true); ST.refresh(); ST.toast(pl === 'premium' ? 'Viewing as a Premium student' : 'Viewing as a Free student', 'crown-simple'); };
    document.querySelectorAll('#pPlan button').forEach(b => b.onclick = () => setPlan(b.dataset.p));
    document.querySelectorAll('#pNet button').forEach(b => b.onclick = () => { ST.setOffline(b.dataset.n === 'off'); ST.syncPanel(); });
    document.querySelectorAll('#pTheme button').forEach(b => b.onclick = () => { ST.setTheme(b.dataset.t); ST.syncPanel(); });
    document.getElementById('pRm').onchange = e => ST.setReduceMotion(e.target.checked);
    document.querySelectorAll('[data-demo]').forEach(b => b.onclick = () => {
      if (ST.current()?.dataset.screen !== 'cbt') ST.go('cbt');
      setTimeout(() => b.dataset.demo === 'submit' ? ST.cbtSubmit() : ST.cbtSetTime(+b.dataset.demo), 350);
    });
    const curTitle = () => (ST.screens[ST.current()?.dataset.screen] || {}).title;
    document.getElementById('pFeedback').onclick = () => ST.openFeedback(curTitle());
    document.getElementById('fab').onclick = () => ST.sheet(`
      <h2 class="t-h3">Prototype menu</h2>
      <div class="card list mt4">
        <button class="list-item" id="fbGo"><span class="lead" style="background:var(--c-accent-soft);color:var(--c-on-accent-soft)"><i class="ph-fill ph-chat-circle-text"></i></span><span class="grow"><b class="t-sm">Give feedback on this screen</b><div class="t-cap muted">${curTitle() || ''}</div></span></button>
        <a class="list-item" href="index.html"><span class="lead"><i class="ph-fill ph-list"></i></span><span class="grow t-sm bold">All screens</span></a>
      </div>
      <div class="field mt4"><span class="field-label">Network</span><div class="seg" id="fNet"><button data-n="on" class="${ST.isOffline() ? '' : 'on'}">Online</button><button data-n="off" class="${ST.isOffline() ? 'on' : ''}">Offline</button></div></div>
      <div class="field mt4"><span class="field-label">View as</span><div class="seg" id="fPlan"><button data-p="free" class="${ST.state.plan === 'free' ? 'on' : ''}">Free student</button><button data-p="premium" class="${ST.state.plan === 'premium' ? 'on' : ''}">Premium student</button></div></div>`, { mount: w => {
        w.querySelector('#fbGo').onclick = () => { ST.closeOverlay(true); ST.openFeedback(curTitle()); };
        w.querySelectorAll('#fPlan button').forEach(b => b.onclick = () => setPlan(b.dataset.p));
        w.querySelectorAll('#fNet button').forEach(b => b.onclick = () => { ST.setOffline(b.dataset.n === 'off'); ST.closeOverlay(); });
      } });
    document.getElementById('pClose').onclick = () => ST.closeChallenge('wk44');
    document.querySelectorAll('[data-trust]').forEach(b => b.onclick = () => ST.go(b.dataset.trust, null, { mode: 'fade' }));
    document.getElementById('pCheat').onclick = () => ST.simulateCheat ? ST.simulateCheat() : ST.toast('Start a challenge first (Test → Challenges & events).', 'info');
    ST.syncPanel();
    ST.boot();
  });
</script>
</body>
</html>
