<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin CMS · SolutionTee CBT prototype</title>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/phosphor/regular/style.css">
<link rel="stylesheet" href="vendor/phosphor/fill/style.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/admin.css">
<script src="js/tokens.js"></script>
</head>
<body class="admin">
<div class="adm" id="adm">
  <aside class="side" id="side" aria-label="Admin navigation">
    <a class="brand" href="#dashboard"><img src="/brand/favicon.svg" alt=""><span><b>SolutionTee</b><small>Admin CMS</small></span></a>
    <button class="side-search" id="sideSearch"><i class="ph ph-magnifying-glass"></i><span>Search or jump to…</span><kbd>Ctrl K</kbd></button>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="env-pill"><span class="env-dot"></span>Prototype data</div>
    </div>
  </aside>
  <div class="scrim-side" id="scrimSide"></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-sm" id="menuBtn" aria-label="Open menu"><i class="ph ph-list"></i></button>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <span class="grow"></span>
      <button class="icon-btn" id="themeBtn" aria-label="Theme"><i class="ph ph-sun"></i></button>
      <div class="menu-wrap"><button class="icon-btn bell" id="alertsBtn" aria-label="Alerts"><i class="ph ph-bell"></i><span class="bell-count tnum" id="alertCount">4</span></button><div class="menu hidden" id="alertsMenu"></div></div>
      <button class="btn btn-accent btn-sm only-lg" onclick="ST.openFeedback(document.title.replace(/ · .*$/, '') + ' (admin)')"><i class="ph-fill ph-chat-circle-text"></i> Feedback</button>
      <div class="menu-wrap"><button class="me-btn" id="meBtn" aria-label="Account"><span class="avatar" style="width:34px;height:34px;font-size:12px">AO</span><span class="only-lg"><b>Ada Okoye</b><small>Super admin</small></span><i class="ph ph-caret-down only-lg"></i></button>
        <div class="menu hidden" id="meMenu">
          <div class="menu-head"><b>Ada Okoye</b><span>ada@solutiontee.com · Super admin</span></div>
          <a href="#audit"><i class="ph ph-list-checks"></i>My activity</a>
          <a href="index.html"><i class="ph ph-squares-four"></i>All prototype screens</a>
          <a href="app.html#/home"><i class="ph ph-device-mobile"></i>Open the student app</a>
          <button data-toast="Two-step login is on for this account"><i class="ph ph-shield-check"></i>Security (2-step on)</button>
          <button data-toast="Signed out (prototype)"><i class="ph ph-sign-out"></i>Sign out</button>
        </div></div>
    </header>
    <main id="page"></main>
  </div>
</div>
<div id="drawer" class="drawer hidden" role="dialog" aria-modal="true"></div>
<div id="palette" class="palette-wrap hidden" role="dialog" aria-modal="true" aria-label="Search"></div>
<div id="overlay" style="position:fixed;inset:0;pointer-events:none;z-index:80"></div>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/auto-render.min.js"></script>
<script src="js/feedback.js"></script>
<script src="js/core.js"></script>
<script src="js/screens-more.js"></script>
<script src="js/screens-trust.js"></script>
<script src="js/admin.js"></script>
<script src="js/admin-shell.js"></script>
</body>
</html>
