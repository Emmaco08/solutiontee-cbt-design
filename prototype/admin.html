<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin CMS · SolutionTee CBT prototype</title>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/phosphor/regular/style.css">
<link rel="stylesheet" href="vendor/phosphor/fill/style.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/admin.css">
<script src="js/tokens.js"></script>
</head>
<body class="admin">
<div class="adm">
  <aside class="side" aria-label="Admin navigation">
    <div class="brand"><img src="/brand/favicon.svg" alt=""><div><b style="color:#fff;font-size:14px">SolutionTee CBT</b><div style="font-size:11px;color:#7F92B4">Admin CMS</div></div></div>
    <a href="#dashboard" data-p="dashboard"><i class="ph ph-squares-four"></i>Dashboard</a>
    <div class="grp">Content</div>
    <a href="#editor" data-p="editor"><i class="ph ph-pencil-simple-line"></i>Questions</a>
    <a href="#csv" data-p="csv"><i class="ph ph-file-csv"></i>CSV import</a>
    <a class="soon" href="#"><i class="ph ph-books"></i>Study content</a>
    <a class="soon" href="#"><i class="ph ph-exam"></i>Exams & years</a>
    <div class="grp">App control</div>
    <a href="#tabs" data-p="tabs"><i class="ph ph-layout"></i>Tabs manager</a>
    <a href="#plans" data-p="plans"><i class="ph ph-sliders-horizontal"></i>Plans & limits</a>
    <a class="soon" href="#"><i class="ph ph-flag"></i>Feature flags</a>
    <div class="grp">People & money</div>
    <a class="soon" href="#"><i class="ph ph-users"></i>Users</a>
    <a class="soon" href="#"><i class="ph ph-receipt"></i>Payments</a>
    <a class="soon" href="#"><i class="ph ph-list-checks"></i>Audit log</a>
    <div class="me"><span class="avatar" style="width:34px;height:34px;font-size:12px">AO</span><div><b style="color:#fff">Ada Okoye</b><div style="font-size:11px;color:#7F92B4">super_admin</div></div></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="input search"><i class="ph ph-magnifying-glass lead-ic"></i><input placeholder="Search questions, users, payments"></div>
      <span class="grow"></span>
      <div class="seg" id="theme" style="width:210px"><button data-t="system">Auto</button><button data-t="light">Light</button><button data-t="dark">Dark</button></div>
      <button class="btn btn-accent btn-sm" onclick="ST.openFeedback(document.title.replace(/ · .*$/, '') + ' (admin)')"><i class="ph-fill ph-chat-circle-text"></i> Give feedback</button>
      <a class="btn btn-outline btn-sm" href="index.html"><i class="ph ph-arrow-left"></i> All screens</a>
    </div>
    <div id="page"></div>
  </div>
</div>
<div id="overlay" style="position:fixed;inset:0;pointer-events:none;z-index:50"></div>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/auto-render.min.js"></script>
<script src="js/feedback.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
